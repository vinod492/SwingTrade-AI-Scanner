[project]
name = "swingtrade-backend"
version = "0.1.0"
description = "SwingTrade AI Scanner backend — FastAPI + PostgreSQL + Redis + arq workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "email-validator>=2.0",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
