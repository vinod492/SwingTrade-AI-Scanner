# Netlify config — hosts the frontend only.
# The backend (API + scan worker + Postgres + Redis) must run on a server host
# such as Railway or Render; see DEPLOY.md. After deploying it, replace
# YOUR-BACKEND-URL below (e.g. https://swingtrade-api.up.railway.app).

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls from the Netlify site to the backend.
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR-BACKEND-URL/api/:splat"
  status = 200
  force  = true

# Single-page-app fallback: every other path serves the React app.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
